steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/jaadu-exe:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/jaadu-exe:latest
      - .
images:
  - gcr.io/$PROJECT_ID/jaadu-exe:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/jaadu-exe:latest
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
